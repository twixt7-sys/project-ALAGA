<div style="height: 70px;"></div>
<div class="shop-container">
  <!-- to convert into component -->
  <app-modal></app-modal>

  <h2>Browse Our Products</h2>

  <div class="search-bar">
    <input
      class="form-control"
      type="text"
      placeholder="Search for products..."
      [value]="searchTerm"
      (input)="onSearch($event)"
    />
  </div>

  <div class="category-row">
    @for (c of categories; track c) {
      <button
        class="magictime swashIn"
        [class.active]="activeCategory === c"
        (click)="filterCategory(c)"
      >
        {{ c }}
      </button>
    }
  </div>

  <div class="product-grid">

    @for (p of filtered; track p.id) {

      <div class="product-card magictime swashIn">

        <div class="img-wrap" onclick="window.dialog.showModal();">
          <img
            [src]="p.imageUrl ?? 'assets/images/placeholder.png'"
            [alt]="p.name"
          />
        </div>

        <div class="details">
          <h3>{{ p.name }}</h3>
          <p>{{ p.description }}</p>

          <div class="meta">
            <span class="price">${{ p.price }}</span>
            <span class="stock">Stock: {{ p.stockQuantity }}</span>
          </div>

          @if (p.stockQuantity > 0) {
            <button class="add-btn">
              Add to Cart
            </button>
          } @else {
            <button class="add-btn" disabled>
              Out of Stock
            </button>
          }
        </div>
      </div>

    }
  </div>
</div>
