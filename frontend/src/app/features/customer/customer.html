<div id="customer-container">
  <app-navbar
    (logoutEvent)="logout()"
    (custCartEvent)="goToCheckout()"
    (custShopEvent)="goToShop()"
    (custOrdersEvent)="goToOrders()"
    [user]="user"
    [active]="active"
    >
  </app-navbar>

  @switch (active) {
    @case ('custShop') {
      <app-shop (checkout)="goToCheckout()"></app-shop>
    }

    @case ('custCheckout') {
      <app-checkout></app-checkout>
    }

    @case ('custOrders') {
      <app-orders></app-orders>
    }
  }
</div>
