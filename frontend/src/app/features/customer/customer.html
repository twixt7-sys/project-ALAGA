<div id="customer-container">
  <app-navbar
    (logoutEvent)="logout()"
    (custCartEvent)="goToCart()"
    (custShopEvent)="goToShop()"
    (custOrdersEvent)="goToOrders()"
    (custCheckout)="goToCheckout()"

    [user]="user"
    [active]="active"
    >
  </app-navbar>

  @switch (active) {
    @case ('custShop') {
      <app-shop></app-shop>
    }

    @case ('custCheckout') {
      <app-checkout (toCartEvent)="goToCart()" (toShopEvent)="goToShop()"></app-checkout>
    }

    @case ('custOrders') {
      <app-orders></app-orders>
    }

    @case ('custCart') {
      <app-cart (checkout)="goToCheckout()"></app-cart>
    }
  }
</div>
